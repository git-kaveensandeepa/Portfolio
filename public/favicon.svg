<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Square Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Monogram K -->
  <g filter="url(#glow)">
    <!-- Vertical Bar -->
    <path d="M 140 110 H 210 V 402 H 140 Z" fill="url(#blueGrad)" rx="12" />
    <!-- Top Diagonal -->
    <path d="M 195 270 L 335 110 H 405 L 255 285 Z" fill="url(#blueGrad)" rx="12" />
    <!-- Bottom Diagonal -->
    <path d="M 245 270 L 395 402 H 325 L 185 280 Z" fill="url(#blueGrad)" rx="12" />
    <!-- Glass Highlight Accent -->
    <path d="M 150 120 H 200 V 392 H 150 Z" fill="url(#glowGrad)" opacity="0.3" />
  </g>
</svg>
